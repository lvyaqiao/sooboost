[package]
name = "sooboost-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "纯 Rust 梯度提升决策树（GBDT）：no_unsafe、arrow 零拷贝、确定可复现"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/sooboost-core"
readme = "../README.md"
keywords = ["gbdt", "gradient-boosting", "decision-tree", "machine-learning", "arrow"]
categories = ["algorithms", "science"]

[dependencies]
arrow = { version = "59.2.0", default-features = false }
arrow-csv = "59.2.0"
rand_xoshiro = "0.8.1"
rayon = "1.10.0"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"

[dev-dependencies]
proptest = "1.11.0"
