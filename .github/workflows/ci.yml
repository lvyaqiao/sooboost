name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rust fmt
        run: cargo fmt --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Build release CLI
        run: cargo build --release -p sooboost-cli

      - name: Build release experiments benchmark
        run: cargo build --release -p sooboost-experiments --bin sooboost-experiments

      - name: Install Python deps
        run: python -m pip install -r benchmark/requirements.txt

      - name: Benchmark alignment gate (sooboost vs gold)
        run: python benchmark/run_benchmark.py --mode sooboost --gate

      - name: Generation and imputation gate (ForestFlow)
        run: python benchmark/run_benchmark.py --mode gen --gate
